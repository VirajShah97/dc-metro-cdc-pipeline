name: 'dc_metro_dbt'
version: '1.0.0'
profile: 'dc_metro_dbt'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  dc_metro_dbt:
    staging:
      +materialized: view
      +schema: STAGING
    marts:
      +materialized: table
      +schema: MARTS

seeds:
  dc_metro_dbt:
    dim_stations:
      +column_types:
        station_code: varchar(10)
        station_name: varchar(100)
        latitude: float
        longitude: float
      +quote_columns: true